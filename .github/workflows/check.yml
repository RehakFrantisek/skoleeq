name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace vývojových závislostí
        run: npm ci

      - name: Validace registru, odkazů a site.config.json
        run: npm run validate

      - name: Unit testy validátoru
        run: npm run test:unit

      - name: Instalace prohlížečů pro Playwright
        run: npx playwright install --with-deps chromium firefox

      - name: Smoke testy (Chromium, mobil, Firefox)
        run: npx playwright test

      - name: Report při selhání
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
